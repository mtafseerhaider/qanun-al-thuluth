name: Deploy dev

# S0-11: merging to main deploys migrations and Edge Functions to thuluth-dev and publishes an
# EAS Update to the development channel. Each step is skipped until its secrets exist, so the
# workflow stays green before the Supabase and Expo accounts are connected.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    name: Migrations + functions to thuluth-dev
    runs-on: ubuntu-latest
    environment: development
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::notice::Supabase dev project not connected yet; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ready == 'true'
        with:
          version: latest
      - if: steps.cfg.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_REF"
      - if: steps.cfg.outputs.ready == 'true'
        run: supabase db push --include-seed
      - if: steps.cfg.outputs.ready == 'true'
        run: supabase functions deploy --project-ref "$PROJECT_REF"

  mobile-update:
    name: EAS Update (development channel)
    needs: backend
    runs-on: ubuntu-latest
    environment: development
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$EXPO_TOKEN" ] || [ -z "$EAS_PROJECT_ID" ]; then
            echo "::notice::EAS project not connected yet; skipping update."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup
        if: steps.cfg.outputs.ready == 'true'
      - uses: expo/expo-github-action@v8
        if: steps.cfg.outputs.ready == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - if: steps.cfg.outputs.ready == 'true'
        working-directory: apps/mobile
        env:
          APP_ENV: development
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
          UPDATE_MESSAGE: ${{ github.event.head_commit.message || 'manual' }}
        run: eas update --channel development --message "$UPDATE_MESSAGE" --non-interactive
