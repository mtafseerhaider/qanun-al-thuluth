name: Deploy production backend

# S7-06: applies migrations, catalog seeds and Edge Functions to thuluth-prod. Manual only
# (workflow_dispatch) until the tag-driven release workflow of 20-ci-cd-pipeline.md section 7 is
# switched on after v1.0.0. Two jobs:
#   plan    environment `production-readonly` (no reviewers): `supabase db push --dry-run`, posted
#           to the job summary so the approver sees exactly which migrations will run.
#   deploy  environment `production` (required reviewer: product owner, prevent self-review):
#           db push (no seeds), catalog seeds, GIT_SHA/APP_ENV, functions deploy, smoke test.
# Nothing here works until the owner creates the environments, secrets and variables listed in
# docs/ops/secrets.md and docs/ops/production-environment.md. Unlike deploy-dev, missing
# configuration FAILS the run (a silent skip in production would look like a successful deploy).
# Mobile releases (EAS Update / store builds) are separate: docs/ops/launch-runbook.md.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to deploy (vX.Y.Z). Branches are refused.
        required: true
      functions:
        description: Deploy Edge Functions after the migrations
        type: boolean
        default: true
      seeds:
        description: Apply catalog seeds (idempotent)
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.48.3
  REF: ${{ github.event.inputs.ref }}

jobs:
  plan:
    name: Production migration plan (dry run)
    runs-on: ubuntu-latest
    environment: production-readonly
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Ref must be a release tag
        run: |
          if ! printf '%s' "$REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::ref must be a release tag like v1.0.0 (got '$REF')"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.REF }}
          fetch-depth: 0
      - name: Tag is on main
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$REF is not on main"; exit 1; }
      - name: Configuration present
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          [ -n "$PROJECT_REF" ] || missing="$missing vars.SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error::production-readonly is missing:$missing (docs/ops/secrets.md)"; exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Dry run
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push --dry-run 2>&1 | tee plan.txt
          {
            echo "### Production migration plan for $REF"
            echo '```'
            cat plan.txt
            echo '```'
            echo "Approve the **production** environment only if every migration above is expected."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to thuluth-prod
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.REF }}
      - name: Configuration present
        run: |
          missing=""
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_DB_URL PROJECT_REF API_BASE_URL SUPABASE_PUBLISHABLE_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::production is missing:$missing (docs/ops/secrets.md)"; exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Link
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Push migrations (no seeds)
        # Never --include-seed: config.toml's seed list includes local vault values and dev fixtures.
        run: supabase db push
      - name: Catalog seeds
        if: ${{ github.event.inputs.seeds == 'true' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          bash tooling/scripts/ops/apply-catalog-seeds.sh
      - name: Release metadata and functions
        if: ${{ github.event.inputs.functions == 'true' }}
        run: |
          supabase secrets set GIT_SHA="$(git rev-parse HEAD)" APP_ENV=production --project-ref "$PROJECT_REF"
          supabase functions deploy --project-ref "$PROJECT_REF"
      - name: Smoke test
        run: bash tooling/scripts/ops/smoke.sh
      - name: Summary
        if: always()
        run: |
          {
            echo "### thuluth-prod deploy of $REF: ${{ job.status }}"
            echo "Watch Sentry (thuluth-edge) error rate and p95 latency for 30 minutes (19 section 12.1)."
            echo "Rollback: docs/ops/launch-runbook.md section 6."
          } >> "$GITHUB_STEP_SUMMARY"
