name: PR checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm turbo run typecheck lint test --cache-dir=.turbo
      - run: pnpm format:check

  edge-functions:
    name: Edge Functions (deno check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check shared packages under Deno
        working-directory: supabase/functions
        run: deno check ../../packages/shared/src/index.ts ../../packages/ai-core/src/index.ts
      - name: Type-check functions
        working-directory: supabase/functions
        run: deno check */index.ts
      - name: Test functions
        run: deno test --config supabase/functions/deno.json --allow-env supabase/tests/functions
      - name: Analytics catalog seed is current
        run: deno run --config supabase/functions/deno.json --allow-read tooling/scripts/gen-analytics-catalog.ts --check

  database:
    name: Migrations + pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: bash tooling/scripts/db-test.sh

  ai-evals:
    name: AI safety release gate (fake provider)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # S7-10: every suite incl. the red team at 100 percent, plus zero child-restriction violations
      # and zero ungrounded religious citations across all replies (docs/ai/s7-safety-gate.md).
      - run: pnpm --filter @thuluth/ai-core evals --suite release --summary ai-eval-summary.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-summary
          path: packages/ai-core/ai-eval-summary.json
          if-no-files-found: ignore

  supply-chain:
    name: Dependency audit + mobile secret check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # MASVS-CODE-3: high/critical advisories in production deps fail the build (reviewed exceptions:
      # package.json pnpm.auditConfig.ignoreGhsas). Registry errors are retried, never reported as findings.
      - name: Dependency vulnerability audit
        run: bash tooling/scripts/audit-deps.sh
      # MASVS-STORAGE-2 / 16 section 19: no service-role key or other server secret in the app source,
      # its public config or the exported JS bundle (offline `expo export`, no credentials).
      - name: Mobile secret check (self-test)
        run: bash tooling/scripts/check-mobile-secrets.sh --self-test
      - name: Mobile secret check (source, config, bundle)
        run: bash tooling/scripts/check-mobile-secrets.sh --bundle

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
