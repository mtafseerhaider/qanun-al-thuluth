# S1-08 to S1-11 / S1-17: onboarding steps 1 to 4 for a new account, then (S2) the intake wizard
# skipped straight to review and the assessment summary, then (S3) the first plan, ending on Today.
# Signs up first (same env as auth/02-signup-otp.yaml). Uses testIDs only, so it passes in en and ur.
appId: ${APP_ID || "app.thuluth.mobile.dev"}
name: 03 onboarding steps 1-4
tags:
  - onboarding
  - sprint-1
---
- runFlow: _signup-to-members.yaml

# Step 4 Members: add an adult (me) and a child
- extendedWaitUntil:
    visible:
      id: 'onboarding-members.screen'
    timeout: 15000
- runFlow:
    file: _add-member.yaml
    env:
      NAME: 'Amina'
      DAY: '14'
      MONTH: '3'
      YEAR: '1990'
- runFlow:
    file: _add-member.yaml
    env:
      NAME: 'Zayd'
      DAY: '2'
      MONTH: '9'
      YEAR: '2019'
- assertVisible:
    id: 'family-members.row-1'
- tapOn:
    id: 'onboarding-members.screen.continue'

# Sprint 2: health intake (skipped here; 05 and 06 cover it) and the assessment summary
- extendedWaitUntil:
    visible:
      id: 'intake-household.screen'
    timeout: 15000
- tapOn:
    id: 'intake-household.screen.next'
- extendedWaitUntil:
    visible:
      id: 'intake-members.screen'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'intake-members.skip-to-review'
    direction: DOWN
- tapOn:
    id: 'intake-members.skip-to-review'
- extendedWaitUntil:
    visible:
      id: 'intake-review.screen'
    timeout: 10000
- tapOn:
    id: 'intake-review.screen.next'
- extendedWaitUntil:
    visible:
      id: 'assessment.members'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'assessment.continue'
    direction: DOWN
- tapOn:
    id: 'assessment.continue'
# Sprint 3: step 6, the first plan, before Today
- runFlow: _finish-first-plan.yaml
- takeScreenshot: 03-onboarding-done
