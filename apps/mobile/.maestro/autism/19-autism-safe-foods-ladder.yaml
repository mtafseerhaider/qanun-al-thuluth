# Sprint 6 (S6-06): autism module. Uses the Usman intake fixture (Maryam, 4, autism module).
# Family -> Autism -> Safe foods: add one (free) -> Ladders: new ladder for a target food, which
# fills the nine calm stages, save -> ladder detail, move up one step (the parent confirms every
# move) -> First-then card. Ladders are premium: needs a premium account in the test environment.
appId: ${APP_ID || "app.thuluth.mobile.dev"}
name: 19 autism safe foods and ladder
tags:
  - autism
  - premium
  - sprint-6
---
- runFlow: ../intake/05-intake-usman.yaml
- extendedWaitUntil:
    visible:
      id: 'today-dashboard.screen'
    timeout: 30000
- tapOn:
    id: 'tab.family'
- scrollUntilVisible:
    element:
      id: 'family-management.module.autism.*'
    direction: DOWN
- tapOn:
    id: 'family-management.module.autism.*'
- extendedWaitUntil:
    visible:
      id: 'autism.hub'
    timeout: 10000

# Safe foods (free tier)
- tapOn:
    id: 'autism.nav.safe'
- extendedWaitUntil:
    visible:
      id: 'safe-foods.screen'
    timeout: 5000
- tapOn:
    id: 'safe-foods.add'
- tapOn:
    id: 'safe-foods.picker.query'
- inputText: 'rice'
- extendedWaitUntil:
    visible:
      id: 'safe-foods.picker.result'
    timeout: 10000
- tapOn:
    id: 'safe-foods.picker.result'
    index: 0
- hideKeyboard
- tapOn:
    id: 'safe-foods.save'
- extendedWaitUntil:
    visible:
      id: 'safe-foods.item'
    timeout: 10000
- back

# Exposure ladder (premium)
- tapOn:
    id: 'autism.nav.ladders'
- extendedWaitUntil:
    visible:
      id: 'ladders.screen'
    timeout: 5000
- tapOn:
    id: 'ladders.new'
- extendedWaitUntil:
    visible:
      id: 'chain.screen'
    timeout: 5000
- tapOn:
    id: 'chain.target.query'
- inputText: 'carrot'
- extendedWaitUntil:
    visible:
      id: 'chain.target.result'
    timeout: 10000
- tapOn:
    id: 'chain.target.result'
    index: 0
- hideKeyboard
- assertVisible:
    id: 'chain.steps'
- scrollUntilVisible:
    element:
      id: 'chain.save'
    direction: DOWN
- tapOn:
    id: 'chain.save'
- extendedWaitUntil:
    visible:
      id: 'ladder.screen'
    timeout: 15000
- assertVisible:
    id: 'ladder.current'
- scrollUntilVisible:
    element:
      id: 'ladder.up'
    direction: DOWN
- tapOn:
    id: 'ladder.up'
# Native confirm dialog (English "Yes" or the Urdu label).
- tapOn:
    text: 'Yes|ہاں'
- takeScreenshot: 19-ladder-detail
- back
- back

# First-then card
- scrollUntilVisible:
    element:
      id: 'autism.nav.first-then'
    direction: DOWN
- tapOn:
    id: 'autism.nav.first-then'
- extendedWaitUntil:
    visible:
      id: 'first-then.board'
    timeout: 5000
- takeScreenshot: 19-first-then
