# supabase/config.toml
# Local stack configuration (10-supabase-structure.md section 3). Only settings that differ from
# CLI defaults are set. Hosted projects thuluth-dev / thuluth-staging / thuluth-prod (region
# eu-central-1, Frankfurt, 00 section 11) are configured to match through the dashboard or the
# Management API; 20-ci-cd-pipeline.md keeps a supabase/remote-settings.json drift check.
project_id = "thuluth"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]   # "private" is never exposed
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
# 10 section 3 says 15. Hosted projects created in 2026 run Postgres 17 and the local major
# version must match the hosted one (dump/diff/types), so the local stack runs 17. Change only
# together with the hosted projects.
major_version = 17

[db.pooler]
enabled = true
pool_mode = "transaction"

[db.seed]
enabled = true
sql_paths = ["./seed/local/000_local_vault.sql", "./seed/catalog/*.sql", "./seed/local/900_dev_fixtures.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[local_smtp]               # local mail catcher (Inbucket/Mailpit) for OTP and invitation emails; 10 calls it [inbucket], renamed in current CLIs
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "https://thuluth.app"
additional_redirect_urls = ["thuluth://auth-callback", "https://thuluth.app/auth/callback", "exp+thuluth://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false         # never on (S1-15): every session is a real, attested user
minimum_password_length = 12            # passwords are disabled for users; this guards admin accounts

# Abuse controls (S1-15, 01 FR-AUTH-09, 11 section 9). GoTrue limits below are per IP per hour
# (email_sent is project-wide); the per-email OTP limits live in the auth-otp edge function on top
# of public.consume_rate_limit. Staging and production set the same values in the dashboard.
[auth.rate_limit]
email_sent = 30                          # per hour, project-wide on the local stack
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

# CAPTCHA on OTP request (S1-15, 01 FR-AUTH-09). Off on the local stack so tests and the simulator
# can sign in; enabled on staging and production with the hCaptcha secret from the environment.
# Deviation: 10-supabase-structure.md section 5 names Turnstile; the PRD and Sprint 1 plan use
# hCaptcha (the client widget, @hcaptcha/react-native-hcaptcha, sends captchaToken with signInWithOtp).
# Owner action: create the hCaptcha site, set HCAPTCHA_SECRET for staging/prod, give the site key
# to the mobile app (EXPO_PUBLIC_HCAPTCHA_SITE_KEY).
[auth.captcha]
enabled = false
provider = "hcaptcha"
secret = "env(HCAPTCHA_SECRET)"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600
max_frequency = "60s"
secure_password_change = true

# OTP email template (en/ur variants by raw_user_meta_data.locale, 10 section 5). Enable once
# supabase/templates/auth/otp.html exists (S1-04); the CLI refuses to start with a missing file.
# [auth.email.template.magic_link]
# subject = "Your Thuluth sign-in code"
# content_path = "./templates/auth/otp.html"

# OAuth providers. Credentials come from supabase/.env (gitignored) or the shell:
#   GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_SECRET, APPLE_OAUTH_SECRET
# Owner action: create the Google OAuth clients and the Apple Services ID / key (Sprint 1, S1-05).
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_SECRET)"
skip_nonce_check = true                  # native Google Sign-In on iOS issues ID tokens without nonce

[auth.external.apple]
enabled = true
client_id = "app.thuluth.mobile"
secret = "env(APPLE_OAUTH_SECRET)"

[auth.mfa]
max_enrolled_factors = 10
[auth.mfa.totp]
enroll_enabled = true                    # offered to admin accounts only (enforced in admin console)
verify_enabled = true

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# ---- Edge Functions: gateway JWT verification per function (10 section 9) ----
# Each function gets a [functions.<name>] block when its folder lands (the CLI refuses entries
# without an index.ts). JWT modes per function are listed in docs/10-supabase-structure.md section 9.1.
[functions.household-invite]
verify_jwt = true
[functions.ai-intake-assess]
verify_jwt = true           # S2-09 intake assessment (06 section 4.2)
[functions.ai-generate-plan]
verify_jwt = false          # dual mode (10 section 9.1): user JWT verified in code; /worker needs x-internal-secret
[functions.ai-adjust-plan]
verify_jwt = true           # S3-14 plan adjustment (06 section 4.4)
[functions.grocery-generate]
verify_jwt = true           # S4-04 grocery list from a plan (06 section 4.7)
[functions.prices-refresh]
verify_jwt = false          # S4-06 cron (pg_cron 00:15); x-internal-secret checked in code
[functions.notifications-dispatch]
verify_jwt = false          # S4-13 cron every minute; x-internal-secret checked in code
[functions.ramadan-generate]
verify_jwt = true           # S5-10 Ramadan plan (06 section 4.x, 15 section 5); premium, async job
[functions.ai-chat]
verify_jwt = true           # S5-03 chat agent, SSE (06 section 4.1)
[functions.ai-analyze-meal]
verify_jwt = true           # S5-07 photo meal analysis (06 section 4.5); premium
[functions.ai-transcribe]
verify_jwt = true           # S5-06 voice transcription, multipart (06 section 4.6); premium
[functions.revenuecat-webhook]
verify_jwt = false          # S5-14 RevenueCat webhook (17 section 7): Authorization secret checked in code; /sync verifies the user JWT in code
[functions.ai-reassess]
verify_jwt = false          # S6-15 periodic reassessment cron (daily, 4-weekly per member); x-internal-secret checked in code
[functions.growth-compute]
verify_jwt = true           # S6-03 growth z-scores, percentiles and alerts (06 section 4.8)
[functions.export-pdf]
verify_jwt = false          # S6-08 dual mode: user JWT verified in code; action purge_expired needs x-internal-secret (cron exports-purge-expired)
[functions.account-export]
verify_jwt = true           # S6-10 account data export, async (06 section 4.12)
[functions.account-delete]
verify_jwt = false          # S6-10 dual mode: user JWT verified in code; /execute and action sweep_orphans need x-internal-secret (crons)
[functions.analytics-rollup]
verify_jwt = false          # S6-13 cron hourly and nightly; x-internal-secret checked in code
