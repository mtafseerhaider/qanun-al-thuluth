# Extends the default gitleaks rules. Allowlist entries must be narrow and explain why.
[extend]
useDefault = true

[[allowlists]]
description = "Free-tier meal plan template keys (pk_t<tier>_<name>) are catalog identifiers, not credentials"
regexTarget = "match"
regexes = ['''key:\s*'pk_t[1-3]_[a-z_]+'''']
paths = ['''packages/ai-core/src/planning/templates\.ts''']

[[allowlists]]
description = "Fake internal secret used only by the Edge Function tests"
regexTarget = "match"
regexes = ['''SECRET\s*=\s*'test-internal-secret-0123456789'''']
paths = ['''supabase/tests/functions/plan-fixtures\.ts''']
